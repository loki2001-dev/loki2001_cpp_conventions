name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update && sudo apt-get install -y clang-format clang-tidy ninja-build
      - name: format
        run: clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h' | grep -v '^3rdparty/')
      - name: configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: tidy
        run: clang-tidy -p build $(git ls-files '*.cpp' | grep -v '^3rdparty/')
      - name: conventions
        run: tools/check-conventions .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["", address, thread]
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.sanitizer == '' && 'Release' || 'Debug' }} \
            -DPROJECT_SANITIZER=${{ matrix.sanitizer }}
          cmake --build build
      - name: test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --timeout 300

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: build
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DPROJECT_FUZZ=ON
          cmake --build build-fuzz
      - name: fuzz
        run: |
          for target in build-fuzz/fuzz_*; do
            [ -x "$target" ] || continue
            name=$(basename "$target")
            mkdir -p "tests/fuzz/corpus/$name"
            "$target" -max_total_time=60 -artifact_prefix=build-fuzz/ "tests/fuzz/corpus/$name"
          done
      - name: keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: build-fuzz/crash-*
