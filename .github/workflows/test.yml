name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup
        run: skills/setup/tests/test
      - name: check
        run: skills/cpp/tests/test
      - name: verification
        run: skills/verification/tests/test
      - name: verify repository
        run: skills/verification/scripts/verify.sh --all-commits .
      - name: version
        run: |
          versions=$(jq -r '.version' .claude-plugin/plugin.json .codex-plugin/plugin.json
            jq -r '.plugins[].version' .claude-plugin/marketplace.json)
          version=$(sort -u <<< "$versions")
          [ "$(wc -l <<< "$version")" -eq 1 ] || { echo "plugin versions differ: $versions"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
